[project]
name = "trading-api"
version = "0.1.0"
description = "Private portfolio application's Python API"
requires-python = ">=3.14.9,<3.15"
dependencies = [
    "alembic==1.20.1",
    "cryptography==50.0.2",
    "fastapi==0.161.0",
    "httpx2==2.16.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pyjwt[crypto]==2.15.1",
    "sqlalchemy==2.1.6",
    "starlette==1.9.0",
    "starlette-csrf==3.0.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = "==0.13.5"
no-build = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["trading_api", "trading_db", "trading_auth"]
