worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 5s;
    client_max_body_size 4k;
    client_body_buffer_size 4k;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $upstream_http_content_security_policy $content_policy {
        "" "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
        default $upstream_http_content_security_policy;
    }
    server {
        listen 8443 ssl;
        server_name 127.0.0.1;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        if ($http_host != "127.0.0.1:8443") { return 400; }
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $content_policy always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=300" always;
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:8443";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_hide_header Cache-Control;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_connect_timeout 3s;
            proxy_read_timeout 25s;
            proxy_send_timeout 10s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
