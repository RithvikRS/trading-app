services:
  gateway:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    entrypoint: [nginx, -g, "daemon off;"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    secrets: [tls_certificate, tls_key]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700"]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 32
    ulimits:
      core: 0
    restart: "no"
    logging:
      driver: local
      options: {max-size: 1m, max-file: "2"}
  api:
    image: trading-app:local-rehearsal
    build:
      context: ../..
      dockerfile: infra/application/Dockerfile
    network_mode: service:gateway
    depends_on: [gateway]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.75
    pids_limit: 64
    ulimits:
      core: 0
    restart: "no"
    logging:
      driver: local
      options: {max-size: 1m, max-file: "2"}
networks:
  default:
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
      com.docker.network.bridge.enable_icc: "false"
secrets:
  tls_certificate:
    file: ${TRADING_REHEARSAL_CERT:?Use scripts/operations.py}
  tls_key:
    file: ${TRADING_REHEARSAL_KEY:?Use scripts/operations.py}
