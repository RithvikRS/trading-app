services:
  postgres:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_USER: trading_bootstrap
      POSTGRES_DB: ${TRADING_DB_NAME:?Use scripts/database.py}
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums
    secrets: [bootstrap]
    command:
      - postgres
      - -c
      - cluster_name=${TRADING_DB_PROJECT:?Use scripts/database.py}
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=30
      - -c
      - shared_buffers=64MB
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -q -U trading_bootstrap -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    shm_size: 128m
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
      com.docker.network.bridge.enable_icc: "false"
secrets:
  bootstrap:
    file: ${TRADING_DB_SECRET_FILE:?Use scripts/database.py}
